---
# After a tag-triggered packaging workflow fails, retry its failed jobs once.
# GitHub also re-runs jobs that depend on the failed jobs. Manual runs and
# subsequent attempts are not retried.
name: Retry failed release jobs
on:
  workflow_run:
    # These workflows (designated by their names) are triggered by push events only for tags.
    workflows:
      - pip packaging
      - DEB Packages
      - RPM Packages
      - Windows Installer
      - macOS DMG
    # Only the completed workflows are concerned (the on-going workflows are ignored)
    types: [completed]
jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        # Retry only the failed jobs of the specified workflow run
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
