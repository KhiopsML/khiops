---
name: macOS DMG
on:
  workflow_dispatch:
  push:
    tags: ['*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build-and-notarize:
    name: Build and notarize macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            minimum_macos_version: '14.0'
          - arch: x86_64
            runner: macos-15-intel
            minimum_macos_version: '14.0'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Check tag consistency
        if: github.ref_type == 'tag'
        uses: ./.github/actions/check-tag-version
      - name: Install build dependencies
        run: brew install cmake ninja open-mpi
      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Create bundled Java runtime
        run: |
          jlink \
            --add-modules java.desktop,jdk.crypto.ec \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output "$RUNNER_TEMP/khiops-jre"
      - name: Create temporary signing keychain
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/khiops-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MAC_CERTS" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)"
          test -n "$SIGNING_IDENTITY"
          {
            printf 'KHIOPS_KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH"
            printf 'KHIOPS_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Build DMG with signed app bundles
        env:
          KHIOPS_CODESIGN_IDENTITY: ${{ env.KHIOPS_SIGNING_IDENTITY }}
        run: |
          packaging/macos/build-app.sh "$RUNNER_TEMP/khiops-jre" "${{ matrix.minimum_macos_version }}"
      - name: Sign DMG
        env:
          KHIOPS_CODESIGN_IDENTITY: ${{ env.KHIOPS_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="build/Khiops-$(./scripts/khiops-version).dmg"
          codesign --force --timestamp --sign "$KHIOPS_CODESIGN_IDENTITY" "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
      - name: Prepare notarization API key
        env:
          MAC_API_KEY: ${{ secrets.MAC_API_KEY }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          if grep -q 'BEGIN PRIVATE KEY' <<< "$MAC_API_KEY"; then
            printf '%s\n' "$MAC_API_KEY" > "$API_KEY_PATH"
          else
            printf '%s' "$MAC_API_KEY" | base64 -D > "$API_KEY_PATH"
          fi
          chmod 600 "$API_KEY_PATH"
          printf 'KHIOPS_API_KEY_PATH=%s\n' "$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Notarize DMG
        env:
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_KEY_ISSUER_ID: ${{ secrets.MAC_API_KEY_ISSUER_ID }}
        run: |
          DMG_PATH="build/Khiops-$(./scripts/khiops-version).dmg"
          SUBMISSION_RESULT="$RUNNER_TEMP/notary-submission.json"
          set +e
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KHIOPS_API_KEY_PATH" \
            --key-id "$MAC_API_KEY_ID" \
            --issuer "$MAC_API_KEY_ISSUER_ID" \
            --wait \
            --output-format json > "$SUBMISSION_RESULT"
          SUBMIT_EXIT_CODE=$?
          set -e
          cat "$SUBMISSION_RESULT"
          SUBMISSION_ID="$(jq -r '.id // empty' "$SUBMISSION_RESULT")"
          SUBMISSION_STATUS="$(jq -r '.status // empty' "$SUBMISSION_RESULT")"
          if [[ -z "$SUBMISSION_ID" ]]; then
            echo "::error::Notary submission returned no submission ID (exit code $SUBMIT_EXIT_CODE)"
            exit 1
          fi
          if [[ "$SUBMISSION_STATUS" != "Accepted" || "$SUBMIT_EXIT_CODE" -ne 0 ]]; then
            echo "::error::Apple notarization failed with status '$SUBMISSION_STATUS'; fetching the detailed report"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KHIOPS_API_KEY_PATH" \
              --key-id "$MAC_API_KEY_ID" \
              --issuer "$MAC_API_KEY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
      - name: Verify signed and notarized DMG
        run: |
          DMG_PATH="build/Khiops-$(./scripts/khiops-version).dmg"
          codesign --verify --deep --strict build/macos-app-stage/Khiops.app
          codesign --verify --deep --strict "build/macos-app-stage/Khiops Coclustering.app"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
      - name: Upload notarized DMG
        uses: actions/upload-artifact@v7
        with:
          name: Khiops-macos-${{ matrix.arch }}
          path: build/Khiops-*.dmg
          if-no-files-found: error
      - name: Clean up signing material
        if: always()
        run: |-
          if [[ -n "${KHIOPS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KHIOPS_KEYCHAIN_PATH" || true
          fi
          rm -f "${KHIOPS_API_KEY_PATH:-}" "$RUNNER_TEMP/developer-id.p12"
  test:
    name: Test macOS DMG (${{ matrix.runner }}-${{ matrix.arch }})
    needs: build-and-notarize
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-15-intel
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install test dependencies
        run: brew install open-mpi
      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: Khiops-macos-${{ matrix.arch }}
          path: artifacts
      - name: Mount and install DMG
        run: |
          DMG_PATH="$(find artifacts -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          MOUNT_POINT="$RUNNER_TEMP/khiops-dmg"
          INSTALL_DIR="$RUNNER_TEMP/khiops-install"
          mkdir -p "$MOUNT_POINT" "$INSTALL_DIR"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          ditto "$MOUNT_POINT/Khiops.app" "$INSTALL_DIR/Khiops.app"
          ditto "$MOUNT_POINT/Khiops Coclustering.app" "$INSTALL_DIR/Khiops Coclustering.app"
          BIN_DIR="$INSTALL_DIR/Khiops.app/Contents/Resources/bin"
          test -x "$BIN_DIR/khiops_env"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
      - name: Check signed executable entitlements
        run: |
          for APP in "Khiops.app" "Khiops Coclustering.app"; do
            for BINARY in MODL MODL_Coclustering MODL_openmpi MODL_Coclustering_openmpi; do
              EXECUTABLE="$RUNNER_TEMP/khiops-install/$APP/Contents/Resources/bin/$BINARY"
              ENTITLEMENTS="$RUNNER_TEMP/khiops-entitlements.plist"
              codesign --verify --strict "$EXECUTABLE"
              codesign -d --xml --entitlements - "$EXECUTABLE" > "$ENTITLEMENTS"
              for KEY in com.apple.security.cs.disable-library-validation \
                         com.apple.security.cs.allow-dyld-environment-variables \
                         com.apple.security.cs.allow-jit \
                         com.apple.security.cs.allow-unsigned-executable-memory; do
                test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$ENTITLEMENTS")" = true
              done
            done
          done
      - name: Check signed FlatLaf native libraries
        run: |
          NATIVE_DIR="com/formdev/flatlaf/natives"
          for APP in "Khiops.app" "Khiops Coclustering.app"; do
            JAR="$RUNNER_TEMP/khiops-install/$APP/Contents/Resources/jars/flatlaf.jar"
            for ARCH in x86_64 arm64; do
              LIBRARY="$RUNNER_TEMP/libflatlaf-macos-$ARCH.dylib"
              unzip -p "$JAR" "$NATIVE_DIR/libflatlaf-macos-$ARCH.dylib" > "$LIBRARY"
              codesign --verify --strict "$LIBRARY"
              codesign -d --verbose=4 "$LIBRARY" 2>&1 | grep -q '^Timestamp='
            done
          done
      - name: Check Khiops installation
        uses: ./.github/actions/test-khiops-install
        with:
          binary-path: ${{ env.BIN_DIR }}
      - name: Run standard tests
        uses: ./.github/actions/run-standard-tests
        with:
          warning_as_error: true
          running-mode: parallel
          test-kni: false
          config: release
          binary-path: ${{ env.BIN_DIR }}
          testing-context-description: ${{ matrix.runner }}-${{ matrix.arch }}
      - name: Detach DMG
        if: always()
        run: |-
          hdiutil detach "$RUNNER_TEMP/khiops-dmg" -force || true
          rm -rf "$RUNNER_TEMP/khiops-install" "$RUNNER_TEMP/khiops-dmg"
  # Release is only executed on tags
  release:
    if: github.ref_type == 'tag'
    needs: [build-and-notarize, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download arm64 DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: Khiops-macos-arm64
          path: dmg-arm64
      - name: Download x86_64 DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: Khiops-macos-x86_64
          path: dmg-x86_64
      - name: Rename packages with architecture suffix
        run: |
          # Both architectures build a DMG with the same name: add the architecture to avoid a clash
          for ARCH in arm64 x86_64
          do
            for DMG_FILE in dmg-$ARCH/*.dmg
            do
              mv "$DMG_FILE" "${DMG_FILE%.dmg}-$ARCH.dmg"
            done
          done
          mkdir -p packages
          mv dmg-*/*.dmg packages/
          ls -l packages
      - name: Upload packages to the release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: packages/Khiops-*.dmg
          body: |
            **This release is for testing purposes only and there is no support for it.**
            **Go to https://khiops.org to install the latest supported version.**
          draft: false
          makeLatest: false
          prerelease: true
          updateOnlyUnreleased: true
