@accentColor = #ff6600
@foreground = #393f4d
@background = #f8fafc
@panelBackground = #ffffff
@windowBackground = #ffffff
@textBackground = #ffffff
@controlBackground = #ffffff
@borderColor = #00000041
@color100 = #eeeeee

@componentPadding = 8,10,8,10
@borderRadius = 10

Button.borderColor = @borderColor

Button.arc = @borderRadius
Button.minimumWidth = 120

Button.margin = @componentPadding
TextField.margin = @componentPadding
TextArea.margin = @componentPadding
PasswordField.margin = @componentPadding
FormattedTextField.margin = @componentPadding

ComboBox.padding = @componentPadding
Spinner.padding = @componentPadding

# Spacing between menu bar items (reuses the same padding)
MenuBar.itemMargins = @componentPadding

TabbedPane.tabHeight = 40
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @accentColor
TabbedPane.disabledUnderlineColor = #999999
TabbedPane.tabSelectionHeight = 2
TabbedPane.tabAreaInsets = 10,0,20,0
TabbedPane.selectedBackground = @background
TabbedPane.selectedForeground = @accentColor
TabbedPane.background = @background
TabbedPane.buttonPressedBackground = @background
TabbedPane.hoverForeground = @accentColor
TabbedPane.hoverColor = @color100
TabbedPane.focusColor = @background

CheckBox.margin = 2,2,2,2
CheckBox.iconTextGap = 6
CheckBox.rollover = true

Viewport.background = @background
ScrollPane.border = 10,15,10,15
ScrollPane.background = @background

Panel.background = @background

ComboBox.minimumWidth = 150
ComboBox.buttonSeparatorWidth = 0
ComboBox.selectionBackground = @color100 
ComboBox.selectionForeground = @foreground

Component.arrowType	= chevron

Table.background = #ffffff
Table.alternateRowColor = #F8FAFC
Table.selectionBackground = #ecf1f7
Table.selectionForeground = #1E293B
Table.gridColor = #F1F5F9

TableHeader.background = #F8FAFC
TableHeader.foreground = #64748B
TableHeader.separatorColor = #ecf1f7
TableHeader.bottomSeparatorColor = #CBD5E1

ScrollBar.thumb = #ecf1f7
ScrollBar.hoverThumbColor = #bbbbbb
ScrollBar.pressedThumbColor = #bbbbbb

ProgressBar.background = #ecf1f7
Slider.trackColor = #ecf1f7
Slider.trackValueColor = @accentColor
Slider.disabledTrackColor = #bbbbbb

Button.hoverBackground = #F3F3F3