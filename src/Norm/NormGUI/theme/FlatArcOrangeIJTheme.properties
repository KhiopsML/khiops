@accentColor = #ff6600
@foreground = #393f4d
@background = #ffffff
@backgroundSection = #f8fafc
@borderColor = #00000041
@color100 = #eeeeee
@borderColorSubtle = #e5e8ec

@componentPadding = 10,10,10,10
@componentMargin = 6,10,6,10
@borderRadius = 10

Component.background = @background
Component.borderColor = @borderColorSubtle

# card fieldset border
TitledBorder.border = 1,1,1,1,@borderColorSubtle,1,12

Button.borderColor = @borderColor
Button.arc = @borderRadius
Button.minimumWidth = 120
Button.focusedBorderColor = #9ba6b8

Button.default.background = #fff2e6
Button.default.startBackground = #fff2e6
Button.default.endBackground = #fff2e6
Button.default.foreground = @accentColor
Button.default.borderColor = @accentColor
Button.default.startBorderColor = @accentColor
Button.default.endBorderColor = @accentColor
Button.default.focusedBorderColor = @accentColor
Button.default.hoverBorderColor = @accentColor
Button.default.hoverBackground = #ffe6d2
Button.default.pressedBackground = #ffd9bb
Button.default.boldText = false

Button.margin = @componentMargin
TextField.margin = @componentMargin
TextArea.margin = @componentMargin
PasswordField.margin = @componentMargin
FormattedTextField.margin = @componentMargin

ComboBox.padding = @componentPadding
Spinner.padding = @componentPadding

# Panel background transparent
# Panel.opaque = false

# Spacing between menu bar items (reuses the same padding)
MenuBar.itemMargins = @componentPadding

TabbedPane.tabHeight = 40
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @accentColor
TabbedPane.tabSelectionHeight = 2
TabbedPane.tabAreaInsets = 0,0,20,0
TabbedPane.selectedBackground = @backgroundSection
TabbedPane.selectedForeground = @accentColor
TabbedPane.background = @backgroundSection
TabbedPane.buttonPressedBackground = @backgroundSection
TabbedPane.hoverForeground = @accentColor
TabbedPane.hoverColor = @color100
TabbedPane.focusColor = @backgroundSection
TabbedPane.contentAreaColor = @borderColorSubtle
TabbedPane.contentSeparatorHeight = 1
TabbedPane.hasFullBorder = false
[style]TabbedPane.nested = border: 5,10,5,10,@borderColorSubtle,1,20

[style]TabbedPane.topLevel = background: @background; opaque: true; \
	selectedBackground: @background; focusColor: @background; \
	contentAreaColor: @borderColorSubtle; contentSeparatorHeight: 1; hasFullBorder: false; border: 0,0,0,0; tabAreaInsets: 15,15,0,15

CheckBox.margin = 2,2,2,2
CheckBox.iconTextGap = 6
CheckBox.rollover = true

Viewport.background = @backgroundSection
ScrollPane.border = 10,15,10,15
ScrollPane.background = @backgroundSection

Panel.background = @backgroundSection

ComboBox.minimumWidth = 150
ComboBox.buttonSeparatorWidth = 0
ComboBox.selectionBackground = @color100 
ComboBox.selectionForeground = @foreground

Component.arrowType	= chevron

Table.background = @background
Table.alternateRowColor = #f0f4f8
Table.selectionBackground = @borderColorSubtle
Table.selectionForeground = #1E293B
Table.gridColor = #F1F5F9

TableHeader.background = #F1F5F9
TableHeader.foreground = #64748B
TableHeader.separatorColor = @borderColorSubtle
TableHeader.bottomSeparatorColor = @borderColorSubtle